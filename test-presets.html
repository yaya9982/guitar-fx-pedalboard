<!doctype html>
<html><head><meta charset="utf-8"><title>Demo preset checks</title>
<style>body{font:13px/1.4 monospace;background:#111;color:#ddd;padding:20px}</style></head>
<body><pre id="out">running...</pre>
<script>
  // Cab/reverb IRs are built from Math.random() noise; seed it so results repeat between runs.
  { let a = 12345; Math.random = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
</script>
<script type="module">
  import { DEMO_PRESETS } from './js/demo-presets.js';
  import { getPedalType } from './js/pedal-registry.js';
  import { getAmpType } from './js/amp-registry.js';

  const SR = 44100, SECS = 3, N = SR * SECS;
  const WORKLETS = ['noise-gate-worklet.js?v=2', 'bitcrusher-worklet.js?v=2', 'pitch-worklet.js?v=2',
    'spectral-denoise-worklet.js?v=2', 'pluck-worklet.js?v=1', 'dynamics-worklet.js?v=1'];
  const out = document.getElementById('out'), lines = [];
  const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };

  // Signals (all mono Float32Array of N samples; signal occupies first 2 s unless noted)
  const pluck = (freqs, peak) => {
    const d = new Float32Array(N);
    freqs.forEach((f0, s) => {
      const t0 = Math.round(s * 0.02 * SR); // slight strum offset
      for (let i = t0; i < 2 * SR; i++) {
        const t = (i - t0) / SR; let v = 0;
        for (let h = 1; h <= 6; h++) v += Math.sin(2 * Math.PI * f0 * h * t) / h;
        d[i] += v * Math.exp(-t * 2.5) * Math.min(1, t / 0.003);
      }
    });
    let m = 0; for (const v of d) m = Math.max(m, Math.abs(v));
    for (let i = 0; i < N; i++) d[i] *= peak / m;
    return d;
  };
  const SIGS = {
    pluck: pluck([110], 0.1),
    chord: pluck([82.41, 123.47, 164.81, 220, 277.18, 329.63], 0.1),
    sine: Float32Array.from({ length: N }, (_, i) => i < 1.5 * SR ? 0.1 * Math.sin(2 * Math.PI * 110 * i / SR) : 0),
  };

  async function render(preset, sig) {
    const ctx = new OfflineAudioContext(1, N, SR);
    for (const w of WORKLETS) await ctx.audioWorklet.addModule('./js/' + w);
    const buf = ctx.createBuffer(1, N, SR); buf.copyToChannel(sig, 0);
    const src = ctx.createBufferSource(); src.buffer = buf;
    // The real engine (audio-engine.js _rebuildChain) puts all pedals first, in order, then the amp.
    const entries = preset.state.chain.filter((e) => e.enabled !== false);
    const ordered = [...entries.filter((e) => e.kind !== 'amp'), ...entries.filter((e) => e.kind === 'amp')];
    let node = src;
    for (const e of ordered) {
      const def = e.kind === 'amp' ? getAmpType(e.typeId) : getPedalType(e.typeId);
      if (!def) throw new Error('unknown type ' + e.typeId);
      const built = await Promise.resolve(def.createNodes(ctx));
      for (const p of def.params) await Promise.resolve(p.apply(built.nodes, e.params[p.key] !== undefined ? e.params[p.key] : p.default, ctx));
      node.connect(built.input);
      if (built.sideChainInput) src.connect(built.sideChainInput);
      node = built.output;
    }
    node.connect(ctx.destination);
    src.start();
    return (await ctx.startRendering()).getChannelData(0);
  }

  const stats = (d) => {
    let s = 0, pk = 0, bad = false;
    for (const v of d) { if (!Number.isFinite(v)) { bad = true; continue; } s += v * v; pk = Math.max(pk, Math.abs(v)); }
    return { rms: Math.sqrt(s / d.length), pk, bad };
  };
  const goertzel = (d, f, a, b) => {
    const w = 2 * Math.PI * f / SR; let re = 0, im = 0;
    for (let i = a; i < b; i++) { re += d[i] * Math.cos(w * i); im += d[i] * Math.sin(w * i); }
    return (re * re + im * im) / ((b - a) ** 2) * 4; // power of that sinusoid component
  };
  // THD-ish: sum of power at harmonics 6..20 of 110 Hz / power at 110 Hz, window 0.5..1.5 s (110 whole cycles)
  const thd6 = (d) => { let h = 0; for (let k = 6; k <= 20; k++) h += goertzel(d, 110 * k, SR / 2, 3 * SR / 2); return h / goertzel(d, 110, SR / 2, 3 * SR / 2); };
  // all harmonics 2..20 (for context)
  const thdAll = (d) => { let h = 0; for (let k = 2; k <= 20; k++) h += goertzel(d, 110 * k, SR / 2, 3 * SR / 2); return h / goertzel(d, 110, SR / 2, 3 * SR / 2); };
  const db = (x) => (20 * Math.log10(x)).toFixed(1);

  const rows = [];
  for (const p of DEMO_PRESETS) {
    try {
      const [a, c, s] = [await render(p, SIGS.pluck), await render(p, SIGS.chord), await render(p, SIGS.sine)];
      rows.push({ name: p.name, A: stats(a), C: stats(c), S: stats(s), thd6: thd6(s), thdAll: thdAll(s), sineRms: stats(s.subarray(SR / 2, 3 * SR / 2)).rms });
    } catch (e) { rows.push({ name: p.name, err: e.message }); }
  }
  const ok = rows.filter((r) => !r.err);
  const med = (arr) => { const x = [...arr].sort((a, b) => a - b); const m = x.length >> 1; return x.length % 2 ? x[m] : (x[m - 1] + x[m]) / 2; };
  const medP = med(ok.map((r) => r.A.rms)), medC = med(ok.map((r) => r.C.rms));
  log(`median RMS: pluck ${medP.toFixed(4)}  chord ${medC.toFixed(4)}\n`);
  log('name'.padEnd(34) + 'verdict  pluckRMS pluckPk  chordRMS chordPk  sineRMS  THD>5th(dB) THD2-20(dB)  dev-vs-median pluck/chord (dB)');
  for (const r of rows) {
    if (r.err) { log(`FAIL ${r.name}: ERROR ${r.err}`); continue; }
    const fails = [];
    for (const [k, m, med0] of [['pluck', r.A, medP], ['chord', r.C, medC], ['sine', r.S, null]]) {
      if (m.bad) fails.push(`${k}: NaN/Inf`);
      if (k !== 'sine' && m.rms <= 0.005) fails.push(`${k}: silent rms=${m.rms.toFixed(4)}`);
      if (m.pk >= 1.5) fails.push(`${k}: peak ${m.pk.toFixed(2)}`);
      if (med0 && Math.abs(20 * Math.log10(m.rms / med0)) > 12) fails.push(`${k}: loudness ${db(m.rms / med0)} dB vs median`);
    }
    log(`${fails.length ? 'FAIL' : 'PASS'} ${r.name.padEnd(30)} ${r.A.rms.toFixed(4).padStart(8)} ${r.A.pk.toFixed(3).padStart(7)}  ${r.C.rms.toFixed(4).padStart(8)} ${r.C.pk.toFixed(3).padStart(7)}  ${r.sineRms.toFixed(4).padStart(7)}  ${db(Math.sqrt(r.thd6)).padStart(9)}  ${db(Math.sqrt(r.thdAll)).padStart(9)}   ${db(r.A.rms / medP).padStart(6)} / ${db(r.C.rms / medC).padStart(6)}${fails.length ? '   <- ' + fails.join('; ') : ''}`);
  }
  log('\nDONE');
  document.title = 'DONE';
</script></body></html>
