name: Deploy Pages

# Publishes master at the site root and the test2 branch preview at /test2/.
on:
  push:
    branches: [master, test2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: site

      - name: Checkout test2 preview
        uses: actions/checkout@v4
        with:
          ref: test2
          path: site/test2

      - name: Strip git metadata, disable Jekyll processing
        run: |
          rm -rf site/.git site/test2/.git
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
