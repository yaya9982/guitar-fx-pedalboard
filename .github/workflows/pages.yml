name: Deploy Pages

# Publishes master at the site root, and the van-halen-amp branch at /van-halen-amp/ as a
# preview. Both are checked out into every build of this file, since the Pages deploy action
# replaces the whole site each run.
on:
  push:
    branches: [master, van-halen-amp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: site

      - name: Checkout van-halen-amp preview branch
        uses: actions/checkout@v4
        continue-on-error: true # don't break master's deploy if this branch is later deleted
        with:
          ref: van-halen-amp
          path: site/van-halen-amp

      - name: Strip git metadata, disable Jekyll processing
        run: |
          rm -rf site/.git
          rm -rf site/van-halen-amp/.git
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
